timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPOSITORY: roamstead
  _API_SERVICE: roamstead-api
  _WEB_SERVICE: roamstead-web
  _API_URL: https://roamstead-api-113080100961.us-central1.run.app
  _WEB_URL: https://roamstead-web-113080100961.us-central1.run.app
  _MAPS_MAP_ID: ''

steps:
  - id: api-tests
    name: python:3.12-slim
    dir: apps/api
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --disable-pip-version-check -e '.[dev]'
        python -m pytest -q

  - id: web-tests
    name: node:22-alpine
    dir: apps/web
    entrypoint: sh
    waitFor: ['-']
    args:
      - -ceu
      - |
        npm ci
        npm test

  - id: build-api
    name: gcr.io/cloud-builders/docker
    dir: apps/api
    waitFor: [api-tests]
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA
      - .

  - id: build-web
    name: gcr.io/cloud-builders/docker
    dir: apps/web
    entrypoint: bash
    secretEnv: [MAPS_BROWSER_API_KEY]
    waitFor: [web-tests]
    args:
      - -ceu
      - |
        docker build \
          --build-arg "API_URL=${_API_URL}" \
          --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$$MAPS_BROWSER_API_KEY" \
          --build-arg "NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${_MAPS_MAP_ID}" \
          --tag "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$COMMIT_SHA" \
          .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA

  - id: push-web
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$COMMIT_SHA

  - id: deploy-api
    name: gcr.io/cloud-builders/gcloud
    waitFor: [push-api]
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --quiet

  - id: deploy-web
    name: gcr.io/cloud-builders/gcloud
    waitFor: [push-web]
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --quiet

  - id: verify-deployment
    name: python:3.12-slim
    waitFor: [deploy-api, deploy-web]
    entrypoint: python
    args:
      - -c
      - |
        import time
        import urllib.request

        targets = (
            ("Roamstead API", "${_API_URL}/health"),
            ("Roamstead web", "${_WEB_URL}"),
        )
        for label, url in targets:
            last_error = None
            for attempt in range(1, 13):
                try:
                    with urllib.request.urlopen(url, timeout=20) as response:
                        if 200 <= response.status < 400:
                            print(f"{label} is healthy: {response.status} {url}")
                            break
                        last_error = RuntimeError(f"unexpected HTTP status {response.status}")
                except Exception as exc:
                    last_error = exc
                if attempt < 12:
                    time.sleep(5)
            else:
                raise SystemExit(f"{label} health check failed: {last_error}")

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/roamstead-maps-browser-key/versions/latest
      env: MAPS_BROWSER_API_KEY
