[project]
name = "roamstead-api"
version = "0.1.0"
description = "FastAPI backend for the Roamstead collaborative housing partner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "uvicorn[standard]>=0.30.0",
  "google-adk[eval]>=2.7.1,<3.0.0",
  "google-cloud-firestore>=2.19.0",
  "google-cloud-bigquery>=3.31.0",
  "google-cloud-bigquery-storage>=2.31.0",
  "google-cloud-pubsub>=2.27.0",
  "google-cloud-storage>=2.19.0",
  "google-cloud-aiplatform>=1.71.0",
  "google-genai>=2.12.1",
  "opentelemetry-exporter-gcp-trace>=1.9.0",
  "opentelemetry-sdk>=1.31.0",
  "python-dotenv>=1.0.1",
  "pillow>=11.0.0"
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["eval_agents*", "tests*"]
