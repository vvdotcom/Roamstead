<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Roamstead Google ADK multi-model workflow</title>
  <desc id="desc">The PartnerCoordinator locks inputs, retrieves semantic memory, runs Gemini listing analysis, starts two Gemma critics in parallel, joins both branches, verifies evidence with one optional correction, and persists the final brief.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#163451" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#547391"/></marker>
    <style>.title{font:700 42px Arial,sans-serif;fill:#102d49}.subtitle{font:20px Arial,sans-serif;fill:#526d87}.box{stroke-width:2;filter:url(#shadow)}.function{fill:#fff;stroke:#75a3cc}.gemini{fill:#e9f2ff;stroke:#4285f4}.gemma{fill:#f2ebff;stroke:#7e57c2}.persist{fill:#e9f8ef;stroke:#34a853}.join{fill:#fff7df;stroke:#e3a900}.head{font:700 21px Arial,sans-serif;fill:#153754}.body{font:16px Arial,sans-serif;fill:#4a657e}.model{font:700 14px Arial,sans-serif;fill:#5e35b1;letter-spacing:.4px}.flow{fill:none;stroke:#547391;stroke-width:3.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#b57516;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}.lane{font:700 15px Arial,sans-serif;fill:#fff;letter-spacing:1.1px}.note{font:700 17px Arial,sans-serif;fill:#6b4d13}.small{font:15px Arial,sans-serif;fill:#587187}</style>
  </defs>
  <rect width="1600" height="940" rx="30" fill="url(#bg)"/>
  <text x="70" y="70" class="title">PartnerCoordinator: durable, parallel, inspectable</text>
  <text x="70" y="106" class="subtitle">Google ADK 2 workflow · public SSE events are persisted before they are emitted</text>
  <path class="flow" d="M300 225H365"/><path class="flow" d="M665 225H730"/><path class="flow" d="M1030 225H1095"/><path class="flow" d="M1300 295V365H1025"/><path class="flow" d="M1300 295V365H1350"/><path class="flow" d="M1025 530V595H1145"/><path class="flow" d="M1350 530V595H1225"/><path class="flow" d="M1185 675V730H955"/><path class="flow" d="M955 805H1040"/><path class="dash" d="M855 730V690H650V805H730"/><path class="flow" d="M1280 805H1350"/>
  <g transform="translate(70 155)"><rect class="box function" width="230" height="140" rx="18"/><text x="22" y="38" class="head">Profile lock</text><text x="22" y="72" class="body"><tspan x="22">Version + exactly three</tspan><tspan x="22" dy="24">listing IDs</tspan></text><text x="22" y="120" class="model">FUNCTION NODE</text></g>
  <g transform="translate(365 155)"><rect class="box gemini" width="300" height="140" rx="18"/><text x="22" y="38" class="head">SemanticMemoryTool</text><text x="22" y="72" class="body"><tspan x="22">Profile-isolated 768d</tspan><tspan x="22" dy="24">Firestore vector retrieval</tspan></text><text x="22" y="120" class="model">GEMINI-EMBEDDING-001</text></g>
  <g transform="translate(730 155)"><rect class="box gemini" width="300" height="140" rx="18"/><text x="22" y="38" class="head">ListingAnalyst</text><text x="22" y="72" class="body"><tspan x="22">Compares bounded evidence</tspan><tspan x="22" dy="24">with approved preferences</tspan></text><text x="22" y="120" class="model">GEMINI-3.5-FLASH</text></g>
  <g transform="translate(1095 155)"><rect class="box function" width="410" height="140" rx="18"/><text x="22" y="38" class="head">Parallel fan-out</text><text x="22" y="72" class="body"><tspan x="22">Both SPECIALIST_STARTED events persist</tspan><tspan x="22" dy="24">before either completion is accepted</tspan></text><text x="22" y="120" class="model">BOUNDED CONCURRENCY</text></g>
  <rect x="835" y="345" width="690" height="205" rx="24" fill="#e8defa" opacity=".55"/><rect x="855" y="325" width="285" height="30" rx="15" fill="#7e57c2"/><text x="997" y="346" text-anchor="middle" class="lane">PARALLEL CRITICS</text>
  <g transform="translate(870 380)"><rect class="box gemma" width="310" height="150" rx="18"/><text x="22" y="38" class="head">VisualEvidenceCritic</text><text x="22" y="72" class="body"><tspan x="22">Audits exact real photos and</tspan><tspan x="22" dy="24">challenges unsupported claims</tspan></text><text x="22" y="130" class="model">GEMMA-4-26B-A4B-IT</text></g>
  <g transform="translate(1195 380)"><rect class="box gemma" width="310" height="150" rx="18"/><text x="22" y="38" class="head">MemoryConsistencyCritic</text><text x="22" y="72" class="body"><tspan x="22">Audits approved profile and</tspan><tspan x="22" dy="24">retrieved decision memory</tspan></text><text x="22" y="130" class="model">GEMMA-4-31B-IT</text></g>
  <g transform="translate(1035 595)"><rect class="box join" width="300" height="80" rx="18"/><text x="150" y="34" text-anchor="middle" class="head">CriticJoin</text><text x="150" y="61" text-anchor="middle" class="body">Waits for both branches</text></g>
  <g transform="translate(730 730)"><rect class="box gemini" width="225" height="150" rx="18"/><text x="22" y="38" class="head">EvidenceVerifier</text><text x="22" y="72" class="body"><tspan x="22">Checks support and</tspan><tspan x="22" dy="24">returns PASS/REVISE</tspan></text><text x="22" y="130" class="model">GEMINI 3.5</text></g>
  <g transform="translate(1040 730)"><rect class="box gemini" width="240" height="150" rx="18"/><text x="22" y="38" class="head">BriefComposer</text><text x="22" y="72" class="body"><tspan x="22">Confirmed, inferred,</tspan><tspan x="22" dy="24">unknown + next actions</tspan></text><text x="22" y="130" class="model">GEMINI 3.5</text></g>
  <g transform="translate(1350 730)"><rect class="box persist" width="180" height="150" rx="18"/><text x="22" y="38" class="head">Persist</text><text x="22" y="72" class="body"><tspan x="22">Brief, events,</tspan><tspan x="22" dy="24">models, timings</tspan></text><text x="22" y="130" class="model" fill="#237b3a">FIRESTORE</text></g>
  <text x="480" y="655" class="note">At most one correction</text><text x="480" y="682" class="small">Same inputs; no score, filter, evidence, or profile mutation</text>
</svg>
