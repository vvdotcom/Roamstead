<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Roamstead CI/CD and production proof pipeline</title>
  <desc id="desc">A push to the main GitHub branch triggers Cloud Build tests, container builds, Artifact Registry pushes, Cloud Run deployments, health checks, and runtime proof in Firestore, BigQuery, and Cloud Trace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#15385f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020b17" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#76adf8"/></marker>
    <style>.title{font:700 42px Arial,sans-serif;fill:#fff}.subtitle{font:20px Arial,sans-serif;fill:#bfd2e7}.box{stroke-width:2;filter:url(#shadow)}.source{fill:#1b2635;stroke:#9ba9b8}.build{fill:#133f70;stroke:#69a9ff}.deploy{fill:#174b39;stroke:#66d19e}.proof{fill:#3a2b64;stroke:#b69cf5}.head{font:700 22px Arial,sans-serif;fill:#fff}.body{font:16px Arial,sans-serif;fill:#d3e1ef}.label{font:700 14px Arial,sans-serif;fill:#87baff;letter-spacing:1px}.flow{fill:none;stroke:#76adf8;stroke-width:4;marker-end:url(#arrow)}.small{font:16px Arial,sans-serif;fill:#c9d8e7}</style>
  </defs>
  <rect width="1600" height="760" rx="30" fill="url(#bg)"/>
  <text x="70" y="76" class="title">Push once. Prove every release.</text>
  <text x="70" y="112" class="subtitle">GitHub → Cloud Build → Artifact Registry → Cloud Run → health and durable execution evidence</text>
  <path class="flow" d="M295 270H355"/><path class="flow" d="M650 270H710"/><path class="flow" d="M1005 270H1065"/><path class="flow" d="M1290 355V420H335"/><path class="flow" d="M1290 355V420H800"/><path class="flow" d="M1290 355V420H1265"/>
  <g transform="translate(70 190)"><rect class="box source" width="225" height="160" rx="20"/><text x="24" y="40" class="label">SOURCE</text><text x="24" y="77" class="head">GitHub main</text><text x="24" y="111" class="body"><tspan x="24">Commit SHA becomes</tspan><tspan x="24" dy="24">the immutable image tag</tspan></text></g>
  <g transform="translate(355 170)"><rect class="box build" width="295" height="200" rx="20"/><text x="24" y="40" class="label">QUALITY GATE</text><text x="24" y="77" class="head">Cloud Build</text><text x="24" y="111" class="body"><tspan x="24">API tests · web tests</tspan><tspan x="24" dy="24">API image · web image</tspan><tspan x="24" dy="24">pipeline stops on failure</tspan></text></g>
  <g transform="translate(710 190)"><rect class="box build" width="295" height="160" rx="20"/><text x="24" y="40" class="label">ARTIFACTS</text><text x="24" y="77" class="head">Artifact Registry</text><text x="24" y="111" class="body"><tspan x="24">Two versioned images</tspan><tspan x="24" dy="24">tagged with commit SHA</tspan></text></g>
  <g transform="translate(1065 180)"><rect class="box deploy" width="450" height="180" rx="20"/><text x="24" y="40" class="label" fill="#7be4af">DEPLOY + CHECK</text><text x="24" y="77" class="head">Cloud Run</text><text x="24" y="111" class="body"><tspan x="24">roamstead-web + roamstead-api</tspan><tspan x="24" dy="24">public URL and /health must succeed</tspan></text></g>
  <g transform="translate(90 445)"><rect class="box proof" width="490" height="180" rx="20"/><text x="24" y="40" class="label" fill="#c2afff">DURABLE STATE</text><text x="24" y="77" class="head">Firestore + vector index</text><text x="24" y="111" class="body"><tspan x="24">Profiles, listings, runs, events, briefs,</tspan><tspan x="24" dy="24">watches, revisions, isolated semantic memory</tspan></text></g>
  <g transform="translate(620 445)"><rect class="box proof" width="360" height="180" rx="20"/><text x="24" y="40" class="label" fill="#c2afff">MODEL PROOF</text><text x="24" y="77" class="head">Persisted event trace</text><text x="24" y="111" class="body"><tspan x="24">Actor, model ID, latency, status,</tspan><tspan x="24" dy="24">parallel group, run ID, degraded flag</tspan></text></g>
  <g transform="translate(1020 445)"><rect class="box proof" width="490" height="180" rx="20"/><text x="24" y="40" class="label" fill="#c2afff">OBSERVABILITY</text><text x="24" y="77" class="head">BigQuery + Cloud Trace</text><text x="24" y="111" class="body"><tspan x="24">Redacted tool trajectories, trace IDs,</tspan><tspan x="24" dy="24">phase timings, failure and completion events</tspan></text></g>
  <rect x="90" y="668" width="1420" height="44" rx="14" fill="#0c213b" stroke="#355677"/><text x="800" y="696" text-anchor="middle" class="small">Runtime secrets stay on existing Cloud Run services; the repository contains no API keys or generated demo media.</text>
</svg>
