<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Roamstead collaborative decision loop</title>
  <desc id="desc">A six-stage loop from user goals through counterfactual analysis, one clarification, an approval gate, a versioned profile revision, and reranked real listings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06162b"/><stop offset="1" stop-color="#102c51"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020b17" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69a7ff"/></marker>
    <style>.title{font:700 42px Arial,sans-serif;fill:#fff}.subtitle{font:20px Arial,sans-serif;fill:#b9cee8}.step{font:700 16px Arial,sans-serif;fill:#7eb4ff;letter-spacing:1.4px}.head{font:700 25px Arial,sans-serif;fill:#fff}.body{font:18px Arial,sans-serif;fill:#d8e6f5}.human{fill:#183e68;stroke:#63a5ff}.tool{fill:#173f39;stroke:#59d3a6}.model{fill:#3a2765;stroke:#b79af8}.box{stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#69a7ff;stroke-width:4;marker-end:url(#arrow)}.chip{font:700 15px Arial,sans-serif;fill:#07172b}.small{font:16px Arial,sans-serif;fill:#c9d9eb}</style>
  </defs>
  <rect width="1600" height="820" rx="30" fill="url(#bg)"/>
  <text x="80" y="78" class="title">The agent leads; the user stays in control</text>
  <text x="80" y="114" class="subtitle">Collaborative Partner loop — measurable questions, explicit approval, persistent learning</text>
  <path class="flow" d="M485 255H565"/><path class="flow" d="M1035 255H1115"/><path class="flow" d="M1360 350V445"/><path class="flow" d="M1115 555H1035"/><path class="flow" d="M565 555H485"/><path class="flow" d="M240 445V390C240 360 200 340 155 340V235C155 198 190 177 230 177"/>
  <g transform="translate(80 160)"><rect class="box human" width="405" height="190" rx="22"/><text x="28" y="38" class="step">01 · USER INTENT</text><text x="28" y="78" class="head">Goal + constraints</text><text x="28" y="112" class="body"><tspan x="28">Buy or rent, budget, space,</tspan><tspan x="28" dy="27">property type, lifestyle priorities</tspan></text><rect x="28" y="150" width="156" height="25" rx="12" fill="#81b7ff"/><text x="48" y="168" class="chip">Human-authored</text></g>
  <g transform="translate(565 160)"><rect class="box tool" width="470" height="190" rx="22"/><text x="28" y="38" class="step" fill="#71e4bc">02 · MEASURE</text><text x="28" y="78" class="head">Counterfactual ranking</text><text x="28" y="112" class="body"><tspan x="28">Tests which preference change would</tspan><tspan x="28" dy="27">most alter the qualified top ten</tspan></text><rect x="28" y="150" width="213" height="25" rx="12" fill="#6fddb8"/><text x="47" y="168" class="chip">Deterministic tool</text></g>
  <g transform="translate(1115 160)"><rect class="box model" width="405" height="190" rx="22"/><text x="28" y="38" class="step" fill="#c5aeff">03 · CLARIFY</text><text x="28" y="78" class="head">One useful question</text><text x="28" y="112" class="body"><tspan x="28">Gemini phrases only the highest-</tspan><tspan x="28" dy="27">impact data-selected tradeoff</tspan></text><rect x="28" y="150" width="148" height="25" rx="12" fill="#c4adff"/><text x="47" y="168" class="chip">Bounded AI</text></g>
  <g transform="translate(1115 445)"><rect class="box human" width="405" height="220" rx="22"/><text x="28" y="38" class="step">04 · APPROVE</text><text x="28" y="78" class="head">Typed proposal</text><text x="28" y="112" class="body"><tspan x="28">User sees predicted rank impact, then</tspan><tspan x="28" dy="27">chooses Accept, Soften, or Reject</tspan></text><rect x="28" y="164" width="202" height="28" rx="14" fill="#81b7ff"/><text x="47" y="184" class="chip">No silent mutation</text></g>
  <g transform="translate(565 445)"><rect class="box tool" width="470" height="220" rx="22"/><text x="28" y="38" class="step" fill="#71e4bc">05 · COMMIT</text><text x="28" y="78" class="head">Versioned profile revision</text><text x="28" y="112" class="body"><tspan x="28">Approval writes the new weight and</tspan><tspan x="28" dy="27">an immutable revision to persistence</tspan></text><rect x="28" y="164" width="243" height="28" rx="14" fill="#6fddb8"/><text x="47" y="184" class="chip">Auditable state change</text></g>
  <g transform="translate(80 445)"><rect class="box tool" width="405" height="220" rx="22"/><text x="28" y="38" class="step" fill="#71e4bc">06 · ADAPT</text><text x="28" y="78" class="head">Rerank + remember</text><text x="28" y="112" class="body"><tspan x="28">Real listings rerank immediately;</tspan><tspan x="28" dy="27">feedback becomes isolated memory</tspan></text><rect x="28" y="164" width="205" height="28" rx="14" fill="#6fddb8"/><text x="47" y="184" class="chip">Persistent feedback</text></g>
  <rect x="80" y="720" width="1440" height="54" rx="16" fill="#0b1d34" stroke="#355677"/><text x="800" y="754" text-anchor="middle" class="small">Hard gates never move: budget · bedrooms · bathrooms · property type  |  Semantic memory is advisory only</text>
</svg>
